[package]
name = "agent-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
repository = "https://github.com/Travis-Gilbert/Agent-Rust"
license = "MIT"
description = "A portable Rust assessment specialist using Theorem policy contracts and LangGraph recovery"
publish = false

[features]
default = ["cli"]
cli = ["dep:clap", "embedded-store", "dep:uuid", "dep:base64", "dep:sha2"]
embedded-store = ["dep:theorem-agent-store"]

[[bin]]
name = "agent-rust"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
theorem-agent-core = { git = "https://github.com/Theoremrs/Theorem", rev = "04ad34cdb0df7cb6e30504c0ec638d7b7d975071" }
theorem-agent-runtime = { git = "https://github.com/Theoremrs/Theorem", rev = "04ad34cdb0df7cb6e30504c0ec638d7b7d975071" }
theorem-agent-store = { git = "https://github.com/Theoremrs/Theorem", rev = "04ad34cdb0df7cb6e30504c0ec638d7b7d975071", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
url = "2"
uuid = { version = "1", features = ["v4"], optional = true }
base64 = { version = "0.22", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"
